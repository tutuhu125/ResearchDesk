function workflow(){let eligible=step===2?labs.filter(l=>l.status===states[1]):labs.slice().sort((a,b)=>Number(b.status===states[0])-Number(a.status===states[0])||Number(b.type!=='Wet lab')-Number(a.type!=='Wet lab')),l=eligible.find(x=>x.id===chosen)||eligible[0];chosen=l?.id||'';let selector='<label>Lab or professor<select id="pick">'+eligible.map(x=>'<option value="'+x.id+'" '+(x===l?'selected':'')+'>'+esc(x.name)+' · '+esc(x.status)+'</option>').join('')+'</select></label>';$('#content').innerHTML='<section class="card flow"><div class="stepbar">'+['1 · Select','2 · Draft','3 · Follow up'].map((s,i)=>'<button class="'+(step===i?'on':'')+'" onclick="startFlow('+i+',chosen)">'+s+'</button>').join('')+'</div><h2>'+['Select your next lab','Draft a meeting request','Track one polite follow-up'][step]+'</h2><p class="muted">'+['Start with labs marked Considering. Computational and hybrid labs appear first within that shortlist.','Connect one research question to your experience and ask for a short conversation.','Review the original contact date and any replies before following up once.'][step]+'</p>'+(!l?'<p>No eligible labs in this step.</p>':selector)+(step===0?'<p class="prefs"><b>Your research interests</b><br>Computational biology · Hybrid wet-lab/computational work · Mechanistic and human-centered biology</p>'+(l?'<p><b>'+esc(l.focus)+'</b><br>'+esc(l.fit||'Add a fit note to compare this lab with your interests.')+'</p>':'')+'<div class="row"><button class="secondary" onclick="edit()">+ Add a candidate</button>'+(l?'<button class="primary" onclick="startFlow(1,chosen)">Draft email →</button>':'')+'</div>':l?step===2&&l.sent?'<p class="prefs">Follow-up already recorded for '+datestr(l.sent)+'.</p>':'<div class="fields"><label class="wide">'+(step===2?'Follow-up draft':'Meeting-request draft')+'<textarea id="body" rows="12">'+esc((step===2?l.followDraft:l.draft)||draft(l,step===2))+'</textarea></label>'+ (step===2?field('planned','Plan follow-up for',l.follow,'date')+'<label>Original contact<span>'+datestr(l.date)+'</span></label>':'')+'</div><div class="row"><button class="secondary" id="copy">Copy email</button><button class="primary" id="record">'+(step===2?'Record follow-up as sent':'Record email as sent')+'</button></div>':'')+'</section>';if($('#pick'))$('#pick').onchange=e=>{chosen=e.target.value;workflow()};if($('#body')){let k=step===2?'followDraft':'draft';$('#body').oninput=e=>{l[k]=e.target.value;save()};let planned=$('[name=planned]');if(planned)planned.onchange=e=>{l.follow=e.target.value;save()};$('#copy').onclick=async()=>{try{await navigator.clipboard.writeText($('#body').value);toast('Email copied')}catch{$('#body').select();toast('Select Copy to copy the draft')}};$('#record').onclick=()=>{l[k]=$('#body').value;if(step===2)l.sent=today();else{if(l.status!=='Considering'){toast('This lab already has a contact record');return}l.date=today();l.status=states[1];let d=new Date(l.date+'T12:00:00');d.setDate(d.getDate()+7);l.follow=d.toISOString().slice(0,10)}save();go(nav[0]);toast('Outreach recorded')}}}
function planner(){let choices=['Coursework','Open for research','Lab reading','Outreach','Research meeting'];$('#content').innerHTML='<section class="card planner"><div class="row"><h2>Weekly research plan</h2><span class="icon sage">'+ico('calendar')+'</span></div><p class="muted">Reserve coursework first. Use one open window for a meeting or a short outreach session.</p>'+['Monday','Wednesday','Thursday'].map((d,i)=>'<div class="day row"><div><b>'+d+'</b><span class="sub">After '+(i===2?'2:00':'3:30')+' p.m. · Central time</span></div><select aria-label="'+d+' plan" onchange="db.plan['+i+']=this.value;save();planner()">'+options(choices,db.plan[i])+'</select></div>').join('')+'<p class="prefs">'+db.plan.filter(x=>x==='Coursework').length+' coursework windows protected · '+db.plan.filter(x=>x==='Open for research').length+' open for research</p><label>Academic deadlines and workload<textarea id="work" placeholder="Add a midterm, assignment, or time you want to protect…">'+esc(db.work||'')+'</textarea></label></section>';$('#work').oninput=e=>{db.work=e.target.value;save()}}
function draw(){const c=$('#art'),w=c.clientWidth,h=c.clientHeight;if(!w)return;c.width=w*2;c.height=h*2;let g=c.getContext('2d');g.scale(2,2);let cells=[[.24,.6,48,30,1],[.58,.42,78,46,3],[.78,.72,59,34,5],[.93,.15,41,26,7],[.36,.06,30,18,8],[.02,.35,23,14,0]];for(let [x,y,rx,ry,k] of cells){g.save();g.translate(x*w,y*h);g.rotate(-.48+.12*Math.sin(k));for(let j=1;j<=22;j++){let r=j/22;g.beginPath();for(let n=0;n<=180;n++){let a=n/180*Math.PI*2,q=1+.13*Math.sin(3*a+k+r*1.8)+.07*Math.cos(5*a+k-r);let px=Math.cos(a)*rx*r*q+(1-r)*rx*.28,py=Math.sin(a)*ry*r*q; n?g.lineTo(px,py):g.moveTo(px,py)}g.strokeStyle='rgba(120,87,154,'+(.24+.38*r)+')';g.lineWidth=.78;g.stroke()}g.restore()}for(let i=0;i<230;i++){let x=Math.abs(Math.sin(i*91.31)*421)%1,y=Math.abs(Math.cos(i*73.37)*173)%1;g.fillStyle='rgba(118,91,142,.3)';g.fillRect(x*w,y*h,1,1)}}window.addEventListener('resize',draw);render();draw();
</script></body></html>
